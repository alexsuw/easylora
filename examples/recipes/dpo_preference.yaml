# Minimal DPO preference tuning recipe. Requires: pip install "easylora[align]"
model:
  base_model: "meta-llama/Llama-3.2-1B"
  torch_dtype: "auto"
  load_in_4bit: true

data:
  dataset_path: "preferences.jsonl"
  prompt_field: "prompt"
  chosen_field: "chosen"
  rejected_field: "rejected"
  max_prompt_len: 1024
  max_seq_len: 2048
  val_split_ratio: 0.02

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: "auto"

optim:
  lr: 5e-5
  warmup_ratio: 0.1
  scheduler: "cosine"

training:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  logging_steps: 10
  save_steps: 250

dpo:
  beta: 0.1

output:
  output_dir: "./output/dpo-adapter"
  run_name: "dpo-adapter"

repro:
  seed: 42
