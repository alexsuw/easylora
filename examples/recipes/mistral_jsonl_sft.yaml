# Local JSONL SFT recipe for Mistral-style causal LM adapters.
model:
  base_model: "mistralai/Mistral-7B-v0.1"
  torch_dtype: "auto"
  load_in_4bit: true

data:
  dataset_path: "train.jsonl"
  format: "auto"
  max_seq_len: 4096
  val_split_ratio: 0.02

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: "auto"

optim:
  lr: 1.8e-4
  warmup_ratio: 0.03
  scheduler: "cosine"

training:
  epochs: 2
  batch_size: 1
  grad_accum: 16
  logging_steps: 10
  save_steps: 250
  gradient_checkpointing: true

output:
  output_dir: "./output/mistral-jsonl-lora"
  run_name: "mistral-jsonl-lora"

repro:
  seed: 42
