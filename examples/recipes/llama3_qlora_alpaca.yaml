# QLoRA recipe for Llama-family instruction SFT.
model:
  base_model: "meta-llama/Llama-3.2-1B"
  torch_dtype: "auto"
  load_in_4bit: true

data:
  dataset_name: "tatsu-lab/alpaca"
  format: "auto"
  max_seq_len: 2048
  val_split_ratio: 0.02

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: "auto"

optim:
  lr: 2e-4
  warmup_ratio: 0.03
  scheduler: "cosine"

training:
  epochs: 3
  batch_size: 2
  grad_accum: 8
  logging_steps: 10
  save_steps: 500
  gradient_checkpointing: true

output:
  output_dir: "./output/llama3-qlora-alpaca"
  run_name: "llama3-qlora-alpaca"
  allow_overwrite: false

repro:
  seed: 42
